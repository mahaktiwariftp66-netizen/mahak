<!DOCTYPE html>
<html lang="en">
    <head>
    <title> Creating a table</title>
    <style>
        caption{
            padding:10px;
            background-color:yellow;
            border: 1px solid black ;
            color: black;
        }   
    </style>
    </head>
    <body>
        <table border="1" padding="10" width="50%" height="50%">
            <caption> My table</caption>
    <tr bgcolor="blue">
        <th >Student name</th>
        <th>= roll number</th>
        <th> contact number</th>
    </tr>
    <tr bgcolor="red">
        <td rowspan="2"> Mahak Tiwari</td>
        <td rowspan="2"> 21</td>
        <td > 8874886811</td>
    </tr>
    <tr bgcolor="pink">
        <td>963852741</td>
    </tr>
     <tr bgcolor="green">
        <td rowspan="2"> Mahak Tiwari</td>
        <td rowspan="2"> 21</td>
        <td> 8874886811</td>
    </tr>
    <tr bgcolor="lightgreen">
         <td>963852741</td>
    </tr>
</table>
</body>
</html>
